repos:
  - repo: local
    hooks:
      - id: reuse
        name: reuse
        entry: uv run --frozen reuse lint
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff-check
        entry: uv run --frozen ruff check --fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
