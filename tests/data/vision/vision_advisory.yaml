---
# Test mapping for new conversion pipeline from Vision Excel to Power Grid Model
id_reference:
  nodes_table: Nodes
  number: Number
  node_number: Node.Number
  sub_number: Subnumber

cel_definitions:
  sqrt_unom:
    expression: "math.sqrt(value_or_default(unom, 0.0) * unom)" # small trick for easier testing
    variables:
      unom: Unom
  no_node2:
    expression: "other_id != 'N002'"
    variables:
      other_id: ID

grid:
  Nodes:
    node:
      id:
        auto_id:
          key: Number
      u_rated:
        CEL: sqrt_unom
      extra:
        - ID
        - Name
        - optional_extra:
            - GUID
            - StationID
      filters:
        - CEL: no_node2

units:
  V:
    kV: 1000.0

substitutions: {}
